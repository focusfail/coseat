[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightdata"
version = "0.1.0"
description = "Parse and model EIS/flight-data CSV files"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.0",
    "torch>=2.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
